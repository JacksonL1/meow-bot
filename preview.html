<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>clawd-starter · 状态与帧序列</title>
    <style>
      body {
        margin: 0;
        padding: 40px 32px;
        background: #faf9f5;
        color: #2c2c2a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 6px;
      }
      p.sub {
        margin: 0 0 28px;
        font-size: 13px;
        color: #5f5e5a;
        line-height: 1.6;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        background: #f1efe8;
        padding: 1px 4px;
        border-radius: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(184px, 1fr));
        gap: 16px;
      }
      .card {
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }
      .art {
        height: 158px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .art svg {
        display: none;
        width: 150px;
        height: 150px;
      }
      .art svg.on {
        display: block;
      }
      .name {
        font-size: 13px;
        font-weight: 500;
        margin-top: 8px;
      }
      .ev {
        font-size: 12px;
        color: #5f5e5a;
        margin-top: 3px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #e6f1fb;
        color: #0c447c;
        margin-left: 6px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <h1>状态 → 帧序列</h1>
    <p class="sub">
      每张卡片都在真的播：帧数少的靠眼球追踪补活气，帧数多的靠轮播。<br />
      事件→状态的权威映射在 <code>src/state.js</code> 的 <code>EVENT_STATE</code>；
      画面数据来自 <code>themes/&lt;id&gt;/theme.json</code>，换主题不动一行代码。
    </p>
    <p class="sub" id="picker">
      主题：<select id="themeSel"></select> <span id="themeDesc"></span>
    </p>
    <div class="grid" id="grid"></div>

    <!-- 这个包由 scripts/build-preview-bundle.js 从 themes/ 生成。
         浏览器直接打开本页时 fetch 会被 file:// 同源策略拦掉，所以只能打包。 -->
    <script src="./preview-bundle.js"></script>
    <script>
      const META = [
        ["sleeping", "睡着", "60s 无事件"],
        ["idle", "发呆", "无会话 / 25s 无事件"],
        ["thinking", "思考", "UserPromptSubmit"],
        ["working", "干活", "PreToolUse / PostToolUse"],
        ["attention", "干完了", "Stop"],
        ["notification", "要你批权限", "PermissionRequest"],
        ["error", "出错", "PostToolUseFailure"],
      ];

      const tpl = document.createElement("template");
      const node = (markup) => {
        tpl.innerHTML = markup.trim();
        return tpl.content.firstElementChild;
      };

      const grid = document.getElementById("grid");
      const sel = document.getElementById("themeSel");
      const desc = document.getElementById("themeDesc");

      let timers = [];
      const stopTimers = () => {
        timers.forEach(clearInterval);
        timers = [];
      };

      function renderTheme(themes, id) {
        stopTimers();
        grid.replaceChildren();
        const theme = themes[id];
        if (!theme) return;
        desc.textContent = theme.description || "";

        for (const [key, label, ev] of META) {
          const def = theme.states[key];
          if (!def) continue;

          const card = document.createElement("div");
          card.className = "card";

          const art = document.createElement("div");
          art.className = "art";
          const nodes = def.frames.map((m) => node(m)).filter(Boolean);
          if (!nodes.length) continue;
          nodes[0].classList.add("on");
          art.append(...nodes);

          let i = 0;
          if (nodes.length > 1) {
            timers.push(
              setInterval(() => {
                nodes[i].classList.remove("on");
                i = (i + 1) % nodes.length;
                nodes[i].classList.add("on");
              }, 1000 / (def.fps || 8))
            );
          }

          const meta = document.createElement("div");
          meta.className = "name";
          meta.textContent = label;
          const badge = document.createElement("span");
          badge.className = "tag";
          badge.textContent = `${def.frames.length} 帧 · ${def.fps}fps${def.eyeTracking ? " · 跟眼" : ""}`;
          meta.appendChild(badge);

          const evEl = document.createElement("div");
          evEl.className = "ev";
          evEl.textContent = `${key} · ${ev}`;

          card.append(art, meta, evEl);
          grid.appendChild(card);
        }
      }

      const themes = window.CLAWD_THEMES || {};
      const ids = Object.keys(themes);

      if (!ids.length) {
        grid.textContent = "没有主题。先跑 npm run build:preview。";
      } else {
        for (const id of ids) {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = `${themes[id].name || id}（${id}）`;
          sel.appendChild(opt);
        }
        // 地址栏 ?theme=crab 可以直连某个主题，截图脚本就是这么指定主题的
        const want = new URLSearchParams(location.search).get("theme");
        sel.value = ids.includes(want) ? want : ids.includes("ragdoll") ? "ragdoll" : ids[0];
        sel.addEventListener("change", () => renderTheme(themes, sel.value));
        renderTheme(themes, sel.value);
      }
    </script>
  </body>
</html>
