<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- SEC-03：和主窗口同样的策略——默认全禁，只开需要的。
         这里多开了 form-action/connect-src 之外没有额外口子：
         页面不发任何网络请求，数据全部来自 preload 的 IPC。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <title>Clawd · 会话</title>
    <style>
      :root {
        --bg: #faf9f5;
        --card: #ffffff;
        --line: #e6e2d8;
        --text: #2c2c2a;
        --muted: #8a8578;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .spacer {
        flex: 1;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
      }
      .toggle input {
        accent-color: #5b8def;
        cursor: pointer;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px 14px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      li {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-areas:
          "badge dir idle"
          "badge sid copy";
        gap: 4px 10px;
        align-items: center;
      }
      /* 当前真正在屏幕上播的那条，用左侧色条标出来——
         和状态徽标是两件事：徽标说"这条在干什么"，色条说"现在显示的是它" */
      li.dominant {
        border-color: #cfd8e6;
        box-shadow: inset 3px 0 0 #5b8def;
      }
      .badge {
        grid-area: badge;
        font-size: 11px;
        line-height: 1;
        padding: 5px 7px;
        border-radius: 6px;
        white-space: nowrap;
        background: #f1efe8;
        color: #6b675c;
      }
      .b-working {
        background: #e8f1fd;
        color: #2f6bbd;
      }
      .b-thinking {
        background: #eeeafb;
        color: #6355a8;
      }
      .b-error {
        background: #fdecec;
        color: #b03a3a;
      }
      .b-attention {
        background: #e9f7ec;
        color: #2f7a44;
      }
      .b-notification {
        background: #fdf3e3;
        color: #9a6a1c;
      }
      .b-sleeping {
        background: #f2f1ee;
        color: #9a958a;
      }
      .dir {
        grid-area: dir;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sid {
        grid-area: sid;
        font-size: 11px;
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .idle {
        grid-area: idle;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .copy {
        grid-area: copy;
        font-size: 11px;
        color: var(--muted);
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        font-family: inherit;
      }
      .copy:hover {
        color: var(--text);
        border-color: #cfc9ba;
      }
      .copy:active {
        background: #f3f1ea;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 20px;
        line-height: 1.9;
      }
      .empty code {
        font-family: ui-monospace, Consolas, monospace;
        background: #f1efe8;
        padding: 1px 5px;
        border-radius: 4px;
      }
      footer {
        padding: 9px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      footer .grow {
        flex: 1;
      }
      /* S7：主题切换。它不是"设置项"，是"我现在想看哪个形象"，
         所以放在底部这种随手可及的位置，而不是藏进菜单。 */
      footer select {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        max-width: 140px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>会话</h1>
      <span class="count" id="count">0</span>
      <span class="spacer"></span>
      <label class="toggle" title="投屏/直播时隐藏项目目录名">
        <input type="checkbox" id="demo" />
        演示模式
      </label>
    </header>

    <main>
      <ul id="list"></ul>
      <div class="empty" id="empty">
        还没有会话。<br />
        在 agent 里发一条消息就会出现在这里。
      </div>
    </main>

    <footer>
      <label class="grow" title="换形象，立即生效">形象 <select id="themeSel"></select></label>
      <span>双击桌宠打开/收起</span>
    </footer>

    <script src="./dashboard-renderer.js"></script>
  </body>
</html>
