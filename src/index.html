<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- SEC-03：默认全禁，再按需开口。
       内联 <style> 需要 'unsafe-inline'；如果不想开，把样式挪进独立 css 文件。
       **这条 meta 不能删**：它是最后一道闸。CSP 一旦缺席，主题里的 SVG 只要漏过
       白名单（或某个包里塞了 <script>），就有执行权。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'"
  />
  <title>clawd-starter · 布偶猫</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: grab;
    }
    #stage:active {
      cursor: grabbing;
    }
    #pet {
      position: relative;
      width: 176px;
      height: 176px;
      pointer-events: auto;
    }
    /* 多猫分身：桌宠同时跑着好几个会话时，每个会话一只猫，横排**互相重叠**。
       重叠不是为了好看——舞台只有 240px 宽，不重叠的话三只猫就排不下了。
       后排的猫往左压进前一只的身体里，视觉上像"一窝猫挤在一起"。 */
    #cast {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    #cast:empty {
      display: none;
    }
    .cat {
      position: relative;
      flex: 0 0 auto;
      cursor: pointer;
      opacity: 0.62;
      /* 切换聚焦、淡出都要"慢慢来"，和别的猫的弹簧节奏对上 */
      transition: opacity 300ms ease, transform 300ms ease;
      transform: translateY(4px) scale(0.9);
    }
    .cat svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    /* 被聚焦的那只：站到最前面、放大一点、完全不透明 */
    .cat.focus {
      opacity: 1;
      transform: translateY(0) scale(1);
      z-index: 3;
    }
    /* 淡出中的猫立刻脱离 flex 流，否则它占着位置，
       剩下的猫会在它消失的那一帧突然跳一下——那是"抽搐"不是"慢慢消失"。 */
    .cat.leaving {
      position: absolute;
      opacity: 0;
      transform: translateY(10px) scale(0.72);
      transition: opacity 1600ms ease, transform 1600ms ease;
      pointer-events: none;
      z-index: 0;
    }
    .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 180ms ease-out;
      pointer-events: none;
    }
    .layer.show {
      opacity: 1;
      pointer-events: auto;
    }
    .layer svg {
      width: 100%;
      height: 100%;
      display: none;
      overflow: visible;
    }
    .layer svg.on {
      display: block;
    }
    #hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(40, 32, 26, 0.72);
      color: #FAF6F0;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }
    body:hover #hint {
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet">
      <div id="cast"></div>
      <div id="layerA" class="layer show"></div>
      <div id="layerB" class="layer"></div>
    </div>
    <div id="hint">拖动我 · 摸头撸猫 · 双击看板 · 右键菜单</div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
