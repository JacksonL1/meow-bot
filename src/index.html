<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- SEC-03：默认全禁，再按需开口。
       内联 <style> 需要 'unsafe-inline'；如果不想开，把样式挪进独立 css 文件。
       **这条 meta 不能删**：它是最后一道闸。CSP 一旦缺席，主题里的 SVG 只要漏过
       白名单（或某个包里塞了 <script>），就有执行权。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'"
  />
  <title>clawd-starter · 布偶猫</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: grab;
    }
    #stage:active {
      cursor: grabbing;
    }
    #pet {
      position: relative;
      width: 176px;
      height: 176px;
      pointer-events: auto;
    }
    .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 180ms ease-out;
      pointer-events: none;
    }
    .layer.show {
      opacity: 1;
      pointer-events: auto;
    }
    .layer svg {
      width: 100%;
      height: 100%;
      display: none;
      overflow: visible;
    }
    .layer svg.on {
      display: block;
    }
    #hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(40, 32, 26, 0.72);
      color: #FAF6F0;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }
    body:hover #hint {
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet">
      <div id="layerA" class="layer show"></div>
      <div id="layerB" class="layer"></div>
    </div>
    <div id="hint">拖动我 · 摸头撸猫 · 双击看板 · 右键菜单</div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
