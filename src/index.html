<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- SEC-03：默认全禁，再按需开口。
       内联 <style> 需要 'unsafe-inline'；如果不想开，把样式挪进独立 css 文件。
       **这条 meta 不能删**：它是最后一道闸。CSP 一旦缺席，主题里的 SVG 只要漏过
       白名单（或某个包里塞了 <script>），就有执行权。

       connect-src 从 'none' 放宽到 "ipc: http://ipc.localhost" 的理由（S10-5）：
       容器换 Rust 后 IPC 不再是 ipcRenderer（进程内、不受 CSP 管），
       而是 Tauri 的 fetch("ipc://localhost/<cmd>")——Windows 上落成
       http://ipc.localhost，属于标准网络请求，会被 connect-src 拦。
       这里**只放行这一个假域名**，公网依然一个都连不上；Tauri 官方文档
       给的也正是这两个值（tauri-utils/src/config.rs 的 csp 注释）。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src ipc: http://ipc.localhost"
  />
  <title>clawd-starter · 布偶猫</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      /* 猫贴着窗口底（下面留 32px 是原来"居中于 240 高"时它自己那点边距）。
         窗口比猫高出来的那一段全留给消息泡泡——**猫在屏幕上的位置不变**：
         窗口是往上长的，底边不动。 */
      align-items: end;
      justify-items: center;
      padding-bottom: 32px;
      cursor: grab;
    }
    #stage:active {
      cursor: grabbing;
    }
    #pet {
      position: relative;
      width: 176px;
      height: 176px;
      pointer-events: auto;
    }
    /* 多猫分身：桌宠同时跑着好几个会话时，每个会话一只猫，横排**互相重叠**。
       重叠不是为了好看——舞台只有 240px 宽，不重叠的话三只猫就排不下了。
       后排的猫往左压进前一只的身体里，视觉上像"一窝猫挤在一起"。 */
    #cast {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    #cast:empty {
      display: none;
    }
    .cat {
      position: relative;
      flex: 0 0 auto;
      cursor: pointer;
      opacity: 0.62;
      /* 切换聚焦、淡出都要"慢慢来"，和别的猫的弹簧节奏对上 */
      transition: opacity 300ms ease, transform 300ms ease;
      transform: translateY(4px) scale(0.9);
    }
    .cat svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    /* 被聚焦的那只：站到最前面、放大一点、完全不透明 */
    .cat.focus {
      opacity: 1;
      transform: translateY(0) scale(1);
      z-index: 3;
    }
    /* 淡出中的猫立刻脱离 flex 流，否则它占着位置，
       剩下的猫会在它消失的那一帧突然跳一下——那是"抽搐"不是"慢慢消失"。 */
    .cat.leaving {
      position: absolute;
      opacity: 0;
      transform: translateY(10px) scale(0.72);
      transition: opacity 1600ms ease, transform 1600ms ease;
      pointer-events: none;
      z-index: 0;
    }
    .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 180ms ease-out;
      pointer-events: none;
    }
    .layer.show {
      opacity: 1;
      pointer-events: auto;
    }
    .layer svg {
      width: 100%;
      height: 100%;
      display: none;
      overflow: visible;
    }
    .layer svg.on {
      display: block;
    }
    /* ======================================================================
       消息泡泡：任务状态不再印在猫身上，而是挂在它头顶
       ======================================================================
       常驻（有活跃会话就显示），一行一个任务，点一行展开详情。

       几何是算过的，别凭手感改：猫头（SVG 里 y≈36/200，缩放后）在 pet 盒里离顶
       32px，pet 离窗口底还有 32px 留白 → 额头在窗口底往上约 166px，耳尖约 192。
       气泡的实际位置由 JS 按**当前那只猫的耳尖**算（renderer.js 的 placeBubble），
       这里的 200 只是没算出来之前的兜底。
       泡泡长高时是**往上长**，不盖猫脸；窗口给到 460 高就是为了让它长到
       4 条任务 + 一条展开时也不必滚动。 */
    #bubble-wrap {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 200px;
      /* 泡泡必须能点（点行 = 聚焦 + 展开）。窗口其余部分是穿透的，
         宿主的命中区判定会把这一块单独算进去，见 renderer.js 的 reportHits。 */
      pointer-events: auto;
      cursor: default;
      opacity: 1;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    /* 消失用"淡下去"而不是 display:none——那个是硬切，像窗口闪了一下。
       但 pointer-events 要立刻关掉，否则透明的泡泡还会吃掉鼠标。 */
    #bubble-wrap.hide {
      opacity: 0;
      transform: translateY(4px) scale(0.98);
      pointer-events: none;
    }
    #bubble {
      padding: 8px 10px;
      background: #FFFDF9;
      border: 1.5px solid #524338;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(60, 45, 35, 0.16);
      /* 上界只是保险：正常内容（4 条任务 + 展开一条 + 底部「说一句」）大约 230px，
         用不到滚动。真超了（比如某天标题折行）就内部滚，绝不把窗口撑破——
         窗口大小是 Rust 那边定的，页面撑不破它，只会把内容裁掉，那更糟。 */
      max-height: 268px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    /* 细滚动条。默认那条 15px 的灰色长条会把这个小卡片压得很脏，
       而且它只在"4 条任务 + 展开"这种极端情况下才出现，平时根本不该看得见。 */
    #bubble::-webkit-scrollbar {
      width: 6px;
    }
    #bubble::-webkit-scrollbar-thumb {
      background: #DED6C6;
      border-radius: 3px;
    }
    #bubble::-webkit-scrollbar-track {
      background: transparent;
    }
    /* 小尖角指向猫。**必须是泡泡的兄弟节点，不能是 ::after**：
       绝对定位在泡泡内部的伪元素会把「可滚动区域」撑大 7px，
       于是四条任务也莫名其妙出现滚动条——那是 ScrollOverflow，不是内容真的多。 */
    #bubble-tail {
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 11px;
      height: 11px;
      margin-left: -6px;
      background: #FFFDF9;
      border-right: 1.5px solid #524338;
      border-bottom: 1.5px solid #524338;
      border-bottom-right-radius: 2px;
      transform: rotate(45deg);
    }
    #bubble-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    /* 「说一句」：桌宠上唯一一个**能发号施令**的入口，所以它必须常驻、
       必须一眼看见——藏进右键菜单的话，用户永远不会知道桌宠能说话。
       贴在列表底下、和任务行隔一条细线，是因为它和上面那些行不是一类东西：
       上面是"正在发生什么"，这一条是"我要它做什么"。 */
    #bubble-say {
      margin-top: 5px;
      padding: 4px 6px 3px;
      border-top: 1px solid #EDE6D8;
      font-size: 11.5px;
      color: #7A6E60;
      cursor: pointer;
      user-select: none;
    }
    #bubble-say:hover {
      color: #3F352C;
      background: #F6F1E7;
      border-radius: 6px;
    }
    /* 每行右侧的 ✎：对着**这一条**说。平时不显示——四条任务各挂一个图标，
       泡泡就变成工具栏了；hover 才出现，需要时才占地方。 */
    .brow .say {
      flex: none;
      margin-left: auto;
      padding: 0 3px;
      font-size: 11px;
      color: #A99F90;
      visibility: hidden;
    }
    .brow:hover .say {
      visibility: visible;
    }
    .brow .say:hover {
      color: #3F352C;
    }
    .brow {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.35;
      cursor: pointer;
    }
    .brow:hover {
      background: #F6F1E7;
    }
    .brow.open {
      background: #F1EBDE;
    }
    /* 状态点：颜色是"一眼可见"的那一层，文字是"看清楚"的那一层，两个都要。 */
    .brow .dot {
      flex: 0 0 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B9B4AA;
    }
    .brow[data-state="working"] .dot { background: #3F7FA8; }
    .brow[data-state="thinking"] .dot { background: #8E7CB0; }
    .brow[data-state="attention"] .dot { background: #D9A441; }
    .brow[data-state="notification"] .dot { background: #C98A3E; }
    .brow[data-state="error"] .dot { background: #B3201A; }
    .brow[data-state="idle"] .dot { background: #9A968C; }
    .brow[data-state="sleeping"] .dot { background: #C6C1B7; }
    /* 状态词用等宽：四条任务并排时，working / thinking 的宽度差会让标题起点
       参差不齐，看起来像排版坏了。 */
    .brow .tag {
      flex: 0 0 auto;
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      font-size: 10px;
      color: #7A7468;
      background: #F1ECE1;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .brow[data-state="error"] .tag {
      color: #fff;
      background: #B3201A;
    }
    .brow[data-state="attention"] .tag {
      color: #7A5A1E;
      background: #FBE8C2;
    }
    .brow .ttl {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #3C362E;
    }
    /* 展开的详情。手风琴而不是替换列表：列表始终在，对比两条任务不用来回切。 */
    .bmore {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 2px 6px 8px 19px;
    }
    /* 必须写这条：.bmore 是 display:flex，会盖掉 hidden 属性自带的 display:none。 */
    .bmore[hidden] {
      display: none;
    }
    .kv {
      display: flex;
      gap: 6px;
      font-size: 11px;
      line-height: 1.45;
    }
    .kv .k {
      flex: 0 0 26px;
      color: #9A9285;
    }
    .kv .v {
      flex: 1 1 auto;
      min-width: 0;
      color: #4A443B;
      word-break: break-all;
    }
    #hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(40, 32, 26, 0.72);
      color: #FAF6F0;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }
    body:hover #hint {
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- 泡泡在 #pet 前面：DOM 顺序不影响层叠（它自己 position:absolute），
         但放在前面能让"猫是主体、泡泡是附注"这件事在结构上也成立。 -->
    <div id="bubble-wrap" class="hide">
      <div id="bubble">
        <div id="bubble-list"></div>
        <div id="bubble-say" title="跟它说一句话（在桌宠里直接发）">✎ 说一句</div>
      </div>
      <div id="bubble-tail"></div>
    </div>
    <div id="pet">
      <div id="cast"></div>
      <div id="layerA" class="layer show"></div>
      <div id="layerB" class="layer"></div>
    </div>
    <div id="hint">拖动我 · 摸头撸猫 · 双击看板 · 右键菜单</div>
  </div>
  <!-- 顺序不能反：renderer.js 顶层就会读 window.clawd，晚一步它就走
       "浏览器预览模式"那一支，桌宠从此一直发呆（见 tauri-bridge.js 开头）。
       Electron 下这个文件第一行就 return，装不装都一样。 -->
  <script src="./tauri-bridge.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
