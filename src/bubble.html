<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <title>权限请求</title>
    <style>
      html,
      body {
        margin: 0;
        /* 窗口是 transparent 的，圆角靠卡片自己画；窗口背景留空才有圆角效果 */
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #2f2e2b;
      }
      #card {
        background: #fffdf9;
        border: 1px solid #ded8cc;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        padding: 12px 14px;
        /* 不要固定高度：渲染完由 renderer 量出来告诉主进程改窗口高度 */
        overflow: hidden;
      }
      /* 顶部 3px 色带 = 风险的"一眼可见"。颜色由 data-risk 驱动，
         渲染层只写一个属性值，不碰 style（CSP 里 style-src 虽然放行了 unsafe-inline，
         但用属性 + CSS 类比直接写 style 好维护）。 */
      .riskbar {
        height: 3px;
        margin: -12px -14px 10px;
        background: #cfc8b8;
      }
      #card[data-risk="low"] .riskbar {
        background: #7f9a6e;
      }
      #card[data-risk="medium"] .riskbar {
        background: #d9a441;
      }
      #card[data-risk="high"] .riskbar {
        background: #d3612f;
      }
      #card[data-risk="critical"] .riskbar {
        background: #b3201a;
      }
      /* 风险徽标：和「需要批准」并列，不是压在它上面——它描述的是这条命令，
         不是这个流程。 */
      .risk {
        font-size: 11px;
        border-radius: 5px;
        padding: 2px 6px;
        color: #6b6a63;
        background: #efece4;
      }
      #card[data-risk="medium"] .risk {
        color: #7a5a1e;
        background: #fbe8c2;
      }
      #card[data-risk="high"] .risk {
        color: #8f3a17;
        background: #fadacb;
      }
      #card[data-risk="critical"] .risk {
        color: #fff;
        background: #b3201a;
      }
      /* 理由列表。只列前几条，多了反而没人读。 */
      ul.why {
        margin: 0 0 8px;
        padding-left: 16px;
        font-size: 11px;
        line-height: 1.55;
        color: #6f6b62;
      }
      ul.why:empty {
        display: none;
      }
      ul.why li + li {
        margin-top: 2px;
      }
      #card[data-risk="high"] ul.why,
      #card[data-risk="critical"] ul.why {
        color: #7c4a3a;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
      }
      .badge {
        font-size: 11px;
        color: #8a6d3b;
        background: #fdf1d8;
        border-radius: 5px;
        padding: 2px 6px;
      }
      .tool {
        font-weight: 600;
        font-size: 14px;
      }
      /* 命令正文是最重要的信息，必须等宽字体、保留换行、可滚动 */
      pre.cmd {
        margin: 0 0 8px;
        padding: 8px 10px;
        background: #f4f1ea;
        border-radius: 8px;
        font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 180px;
        overflow: auto;
      }
      .meta {
        font-size: 11px;
        color: #8a877e;
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        flex: 1;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid #cfc8b8;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #f6f2e9;
      }
      /* 允许按钮不做成"醒目的主色"：避免用户不读内容就顺手点 */
      button.deny {
        flex: 0 0 84px;
      }
      button.allow {
        flex: 0 0 84px;
        border-color: #b7c9a8;
        background: #f2f7ee;
      }
      .note {
        margin-top: 8px;
        font-size: 11px;
        color: #9a968c;
        line-height: 1.4;
      }
      .queue {
        margin-top: 6px;
        font-size: 11px;
        color: #8a6d3b;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="riskbar"></div>
      <div class="head">
        <span class="badge">需要批准</span>
        <span class="tool" id="tool">…</span>
        <span class="risk" id="risk"></span>
      </div>
      <pre class="cmd" id="cmd"></pre>
      <ul class="why" id="why"></ul>
      <div class="meta" id="meta"></div>
      <div class="row">
        <button class="deny" id="btnDeny">拒绝</button>
        <button class="allow" id="btnAllow">允许</button>
      </div>
      <div class="queue" id="queue" hidden></div>
      <div class="note">
        不点任何按钮会在 2 分钟后交还给 Claude Code 自己提示；按 Esc 立即交还。
      </div>
    </div>
    <script src="./bubble-renderer.js"></script>
  </body>
</html>
